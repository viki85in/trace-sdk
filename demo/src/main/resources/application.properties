spring.application.name=orders-demo
server.port=8080

# --- Trace SDK -------------------------------------------------------------
# Tracing stays off unless a service name exists (spring.application.name is used above).
# L2_STEP also records step events; the default is L1_BOUNDARY.
trace.level=L2_STEP
# Exception messages are off by default (they can carry sensitive data); on for the demo.
trace.capture.exception.message=true
trace.environment=demo
trace.service.version=0.1.0

# Jaeger all-in-one listens for OTLP/HTTP here (these are also the defaults).
trace.exporter.endpoint=http://localhost:4318/v1/traces
trace.exporter.protocol=http/protobuf
# Flush quickly so spans show up in Jaeger almost immediately.
trace.batch.max.delay.ms=500
